name: Update player values

on:
  schedule:
    # Every Sunday at 09:00 UTC
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scripts/player-value-crawler
        run: pip install -r requirements.txt

      - name: Run player value crawler
        working-directory: scripts/player-value-crawler
        env:
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        run: python3 webcrawler.py
